services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: catalogue-app:stable
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 8080
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: catalogue_portal
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET in .env}
      TEMP_ADMIN_USERNAME: ${TEMP_ADMIN_USERNAME:-admin}
      TEMP_ADMIN_PASSWORD: ${TEMP_ADMIN_PASSWORD:?Set TEMP_ADMIN_PASSWORD in .env}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - ${MONGO_DATA_DIR:-./catalogue-data/mongodb}:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
