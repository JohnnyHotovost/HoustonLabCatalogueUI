services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: catalogue-app:stable
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 8080
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: catalogue_portal
      CORS_ORIGINS: "*"
      JWT_SECRET: change-this-long-random-secret
      TEMP_ADMIN_USERNAME: admin
      TEMP_ADMIN_PASSWORD: HoustonLab10
    ports:
      - "8080:8080"

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - ./catalogue-data/mongodb:/data/db